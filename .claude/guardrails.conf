# Guardrail settings for this project. Shell syntax: NAME="value".
# Paths are relative to the folder Claude is launched from; * also matches "/".

# Branches nobody pushes to directly (space-separated).
PROTECTED_BRANCHES="main staging"

# Branches that only take release PRs, and the branches allowed to be released.
# With staging + main: "main" and "staging". With one branch: leave both empty.
PROMOTION_ONLY_BRANCHES="main"
PROMOTION_HEADS="staging"

# Production hosts Claude must not ssh/scp/rsync to (space-separated).
PROD_HOSTS=""

# Commands Claude must not run, one per line (e.g. firebase deploy).
BLOCKED_COMMANDS="
"

# Files Claude must not edit (space-separated globs).
DEAD_PATHS="node_modules/* */node_modules/*"

# Reminders after an edit, one per line: glob|message
REMINDERS="
"
